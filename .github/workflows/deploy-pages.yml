name: Deploy Consegne Tracker to Pages

on:
  push:
    branches: ["claude/delivery-tracking-app-rszzf5", "main"]
    paths:
      - "consegne-tracker/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: consegne-tracker
      - id: deployment
        uses: actions/deploy-pages@v4
