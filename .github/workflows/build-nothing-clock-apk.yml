name: Build Nothing Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/nothing-clock-apk-build-yckbjw
    paths:
      - .github/workflows/build-nothing-clock-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SushiiReboot/nothing-clock
          path: nothing-clock

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bump Gradle wrapper and AGP version
        working-directory: nothing-clock
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i "s#id \"com.android.application\" version '8.8.0'#id \"com.android.application\" version '8.12.1'#" android/settings.gradle

      - name: Install dependencies
        working-directory: nothing-clock
        run: flutter pub get

      - name: Build release APK
        working-directory: nothing-clock
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nothing-clock-apk
          path: nothing-clock/build/app/outputs/flutter-apk/app-release.apk
