name: Build Nothing Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/nothing-clock-apk-build-yckbjw
    paths:
      - .github/workflows/build-nothing-clock-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SushiiReboot/nothing-clock
          path: nothing-clock

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable

      - name: Install dependencies
        working-directory: nothing-clock
        run: flutter pub get

      - name: Build release APK
        working-directory: nothing-clock
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nothing-clock-apk
          path: nothing-clock/build/app/outputs/flutter-apk/app-release.apk

      - name: Commit APK to repo
        run: |
          mkdir -p dist
          cp nothing-clock/build/app/outputs/flutter-apk/app-release.apk dist/nothing-clock-app-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/nothing-clock-app-release.apk
          git commit -m "Add built Nothing Clock release APK" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
